<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
  <title id="t">Ahoy — Captain greeting</title>
  <desc id="d">A cartoon sea captain at the helm, welcoming you aboard the Ahoy delivery control plane, with a reminder that no phase advances without a passing gate.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b3b52"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="300" rx="14"/></clipPath>
    <style>
      .hi   { font: 700 34px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#e8eef4 }
      .sub  { font: 400 15px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#a8bccd }
      .quip { font: italic 400 13px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#8ba0b4 }
      .mono { font: 500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#4cc9c0 }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="300" fill="url(#sky)"/>

    <!-- moon -->
    <circle cx="806" cy="52" r="16" fill="#e8eef4" opacity="0.16"/>

    <!-- distant sea -->
    <g opacity="0.5">
      <path d="M0 232 q26 -8 52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0"
            fill="none" stroke="#2a4763" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M0 254 q26 -8 52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0"
            fill="none" stroke="#22394f" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M0 276 q26 -8 52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0"
            fill="none" stroke="#1b2f42" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- ship's wheel behind the captain -->
    <g transform="translate(672,168)" opacity="0.9">
      <circle r="54" fill="none" stroke="#8a6a45" stroke-width="7"/>
      <circle r="17" fill="none" stroke="#8a6a45" stroke-width="6"/>
      <circle r="5" fill="#8a6a45"/>
      <g stroke="#8a6a45" stroke-width="6" stroke-linecap="round">
        <path d="M0 -17 L0 -70"/><path d="M0 17 L0 70"/>
        <path d="M-17 0 L-70 0"/><path d="M17 0 L70 0"/>
        <path d="M-12 -12 L-50 -50"/><path d="M12 12 L50 50"/>
        <path d="M12 -12 L50 -50"/><path d="M-12 12 L-50 50"/>
      </g>
    </g>

    <!-- the captain -->
    <g transform="translate(672,196)">
      <!-- body -->
      <path d="M-42 96 q0 -56 42 -56 q42 0 42 56 Z" fill="#14344b"/>
      <path d="M-14 44 q14 16 28 0 l0 -14 l-28 0 Z" fill="#e8eef4"/>
      <!-- arm raised in greeting -->
      <path d="M34 52 q26 -6 30 -34" fill="none" stroke="#14344b" stroke-width="15" stroke-linecap="round"/>
      <circle cx="66" cy="14" r="9" fill="#f0c9a4"/>
      <!-- head -->
      <circle cy="6" r="30" fill="#f0c9a4"/>
      <!-- beard -->
      <path d="M-26 8 q4 34 26 34 q22 0 26 -34 q-26 14 -52 0 Z" fill="#e8eef4"/>
      <!-- eyes: one open, one very much on the gates -->
      <circle cx="-11" cy="0" r="3.2" fill="#0d1b2a"/>
      <circle cx="11" cy="0" r="3.2" fill="#0d1b2a"/>
      <!-- eyebrows, unimpressed -->
      <path d="M-18 -9 q7 -4 14 -1" fill="none" stroke="#0d1b2a" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M4 -10 q7 -3 14 1" fill="none" stroke="#0d1b2a" stroke-width="2.4" stroke-linecap="round"/>
      <!-- pipe -->
      <path d="M14 20 q16 2 18 -6" fill="none" stroke="#8a6a45" stroke-width="4" stroke-linecap="round"/>
      <circle cx="34" cy="10" r="4" fill="#8a6a45"/>
      <!-- hat -->
      <path d="M-34 -14 q34 -30 68 0 Z" fill="#0f2739"/>
      <rect x="-40" y="-16" width="80" height="9" rx="4.5" fill="#0f2739"/>
      <path d="M0 -30 L4 -22 L12 -22 L6 -17 L8 -9 L0 -14 L-8 -9 L-6 -17 L-12 -22 L-4 -22 Z" fill="#f4a259"/>
    </g>

    <!-- greeting -->
    <g transform="translate(64,116)">
      <text class="hi" x="0" y="0">Ahoy.</text>
      <text class="sub" x="0" y="30">Welcome aboard. I read the phase, I run the gate, I stop.</text>
      <text class="quip" x="0" y="58">I do not improvise, I do not force-push, and I have never once</text>
      <text class="quip" x="0" y="76">written your application code into /tmp. Recently.</text>
      <text class="mono" x="0" y="112">$ bash gates/preflight.sh</text>
    </g>

    <!-- speech bubble tail from captain -->
    <g opacity="0.55">
      <circle cx="592" cy="150" r="4" fill="#8ba0b4"/>
      <circle cx="576" cy="142" r="3" fill="#8ba0b4"/>
      <circle cx="562" cy="136" r="2" fill="#8ba0b4"/>
    </g>
  </g>
</svg>
